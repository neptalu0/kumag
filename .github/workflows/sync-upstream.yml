name: Sync Upstream (louislam/uptime-kuma)

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch and Merge Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote
          git remote add upstream https://github.com/louislam/uptime-kuma.git || true
          git fetch upstream master

          # Ensure we are on master
          git checkout master

          # Check if upstream has new commits (ignoring this workflow file)
          if git diff --quiet HEAD upstream/master -- ':!.github/workflows/sync-upstream.yml'; then
            echo "Already up to date with upstream (no new changes)."
            exit 0
          fi

          echo "New upstream changes detected. Merging..."
          # Merge upstream while keeping our local custom commits intact
          git merge upstream/master -m "chore: sync upstream [skip ci]"

          # Push changes to fork
          git push origin master
